worker_processes 1;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  map $uri $crm_cache_control {
    default "no-store";
    ~*\.(js|css|woff2?|svg|png)$ "public, max-age=31536000, immutable";
  }
  upstream crm_server {
    server crm-server:8080;
  }
  server {
    listen 80;
    # entry（目录形式，qiankun 挂载对尾部形态敏感）与静态资源
    location ^~ /app/crm/ {
      alias /www/crm/;
      try_files $uri $uri/ /app/crm/index.html;
      add_header Cache-Control $crm_cache_control;
    }
    # CRM API：原样转发到 CRM 管理宿主，不做前端路由兜底。
    location /api/crm/ {
      proxy_pass http://crm_server;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / {
      return 404;
    }
  }
}
